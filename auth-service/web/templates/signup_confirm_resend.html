{{define "title"}}Confirm your email{{end}}

{{define "content"}}
<div class="card">
    {{template "logo" .}}

    <hr class="divider">

    <h2>Confirm your email</h2>

    <p>Enter the address you signed up with and we'll email it a 6-digit code.</p>

    {{if .Error}}
    <div class="error-message">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/signup/confirm/resend" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="text-field">
            <input
                type="email"
                id="email"
                name="email"
                value="{{.Email}}"
                placeholder=" "
                required
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                autofocus
            >
            <label for="email">Email</label>
        </div>

        <button type="submit" class="btn btn-primary">Send me a code</button>
    </form>

    <p class="text-center">
        <a class="text-link" href="/oauth/login">Back to sign in</a>
    </p>
</div>
{{end}}
