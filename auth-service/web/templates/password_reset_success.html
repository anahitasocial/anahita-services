{{define "title"}}Password Reset{{end}}

{{define "content"}}
<div class="card">
    {{template "logo" .}}

    <hr class="divider">

    <h2>Password reset successful</h2>

    <p>Your password has been updated. A confirmation email has been sent to your address.</p>

    <p>Please sign in with your new password to continue.</p>

    <a href="/oauth/login" class="btn btn-primary">Sign in</a>
</div>
{{end}}
