apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-grpc-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: file-grpc-service
  template:
    metadata:
      labels:
        app: file-grpc-service
    spec:
      containers:
      - name: file-grpc-service
        image: anahita/file-grpc-service:0.9.0
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: ENV
        - name: AWS_PROFILE
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: AWS_PROFILE
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: AWS_DEFAULT_REGION
        - name: AWS_FILES_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: AWS_FILES_S3_BUCKET
        - name: AWS_FILES_S3_ASSETS_DIR
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: AWS_FILES_S3_ASSETS_DIR
        - name: AWS_KMS_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: AWS_KMS_KEY_ID
        volumeMounts:
        - name: aws-credentials
          mountPath: /root/.aws
          readOnly: true
      volumes:
      - name: aws-credentials
        secret:
          secretName: aws-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: file-grpc-service-svc
spec:
  type: ClusterIP
  selector:
    app: file-grpc-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
