# graph-grpc-service: the only service that reads and writes nodes and edges.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-grpc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-grpc-service
  template:
    metadata:
      labels:
        app: graph-grpc-service
    spec:
      containers:
        - name: graph-grpc-service
          image: anahita/graph-grpc-service
          ports:
            - name: grpc
              containerPort: 50051
          env:
            # Whether profiles have video at all.
            - name: VIDEO_UPLOADS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: VIDEO_UPLOADS
                  optional: true
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ENV
            # Mutual TLS on the gRPC port. Unset means on, except with ENV=dev.
            - name: GRPC_TLS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: GRPC_TLS
                  optional: true
            # What people who are not signed in may see, and whether anything
            # new may be public. The same for every service.
            - name: SITE_READ_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: SITE_READ_ACCESS
                  optional: true
            - name: MIN_CONTENT_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: MIN_CONTENT_ACCESS
                  optional: true
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: DSN
            - name: AMQP_ADDR
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: AMQP_ADDR
            # So a purge a super administrator asks for also removes the
            # uploaded avatars, covers and photos. Without it the rows go
            # and the objects stay.
            - name: FILE_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: FILE_SERVICE_ADDR
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: grpc-tls
              mountPath: /run/secrets/grpc
              readOnly: true
      volumes:
        # This service's own certificate, from k8s/base/grpc-tls.yml.
        - name: grpc-tls
          secret:
            secretName: anahita-grpc-graph
---
apiVersion: v1
kind: Service
metadata:
  name: graph-grpc-service
spec:
  selector:
    app: graph-grpc-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
