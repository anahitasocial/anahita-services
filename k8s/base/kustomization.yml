# Everything Anahita itself needs, and nothing a site has to decide: no
# hostnames, no secrets, no database. It is not applied on its own. An overlay
# in ../overlays adds those; see docs/deploying.md.
#
# Needs cert-manager in the cluster, for the certificates in grpc-tls.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: anahita

resources:
  - gateway.yml
  - ingress.yml
  - grpc-tls.yml
  - grpc/file-grpc.yml
  - grpc/graph-grpc.yml
  - grpc/mail-grpc.yml
  - jobs/migration-job.yml
  - jobs/sweeper-cronjob.yml
  - services/actor.yml
  - services/abuse-report.yml
  - services/auth.yml
  - services/feed.yml
  - services/hashtag.yml
  - services/identity-image.yml
  - services/like.yml
  - services/link-preview.yml
  - services/location.yml
  - services/notification.yml
  - services/photo.yml
  - services/video.yml
  - services/video-worker.yml
  - services/export.yml
  - services/export-worker.yml
  - services/recommendation.yml
  - services/search.yml
  - services/socialgraph.yml
  - services/text.yml

# Non-secret settings, one entry per variable in docs/configuration.md. Each
# manifest picks the ones its service reads, as docker-compose.yml does.
configMapGenerator:
  - name: anahita-config
    envs:
      - config.env
