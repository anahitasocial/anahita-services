# Account sweeper.
#
# Permanently erases profiles whose 30-day deletion grace period has expired:
# purges the content graph, tombstones the actor node so the handle stays
# reserved, and publishes a purged event that tells auth-service to remove the
# credentials and auth logs it owns.
#
# A CronJob rather than a goroutine inside graph-grpc-service, which may run
# several replicas: an in-process loop there would put as many concurrent
# sweeps on the same queue, issuing overlapping recursive deletes against the
# same rows.
#
# Run it by hand with:
#   kubectl -n anahita create job --from=cronjob/account-sweeper sweeper-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: account-sweeper
spec:
  # Hourly, on the hour. The deadline is a date rather than a moment — somebody
  # who deleted at 09:15 does not care whether the purge lands at 09:15 or 09:59
  # thirty days later — so anything more frequent is load without a benefit.
  schedule: "0 * * * *"

  # Never two at once. A sweep that outruns the hour would otherwise overlap the
  # next one; the advisory lock in the job catches this too, but not starting a
  # second pod is cheaper than starting one that immediately exits.
  concurrencyPolicy: Forbid

  # A missed window is not worth catching up on out of order — the next tick
  # picks up everything that is still due anyway.
  startingDeadlineSeconds: 300

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt, then wait for the next hour. Retrying a sweep that failed
      # on infrastructure gains nothing an hour of patience does not.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: account-sweeper
        spec:
          restartPolicy: Never
          containers:
            - name: account-sweeper
              image: anahita/sweeper-job
              env:
                - name: ENV
                  valueFrom:
                    configMapKeyRef:
                      name: anahita-config
                      key: ENV
                - name: DSN
                  valueFrom:
                    secretKeyRef:
                      name: anahita-secrets
                      key: DSN
                - name: AMQP_ADDR
                  valueFrom:
                    secretKeyRef:
                      name: anahita-secrets
                      key: AMQP_ADDR
                # So uploaded avatars, covers and photos are deleted from
                # storage as accounts are purged. Without it the rows go and
                # the objects stay.
                - name: FILE_SERVICE_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: anahita-config
                      key: FILE_SERVICE_ADDR
