# activitypub-service: Speaks to other servers of the fediverse: who is here and chose to be found, and what they post. Optional: an installation that leaves it out is on nobody's fediverse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitypub-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activitypub-service
  template:
    metadata:
      labels:
        app: activitypub-service
    spec:
      containers:
        - name: activitypub-service
          image: anahita/activitypub-service
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ENV
            # Mutual TLS on the calls to the gRPC services. Unset means on,
            # except with ENV=dev.
            - name: GRPC_TLS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: GRPC_TLS
                  optional: true
            # What people who are not signed in may see, and whether anything
            # new may be public. The same for every service.
            - name: SITE_READ_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: SITE_READ_ACCESS
                  optional: true
            - name: MIN_CONTENT_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: MIN_CONTENT_ACCESS
                  optional: true
            - name: AMQP_ADDR
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: AMQP_ADDR
            - name: SECURE_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: SECURE_COOKIE_KEY
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REDIS_ADDR
            - name: REDIS_TLS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REDIS_TLS
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: GRAPH_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: GRAPH_SERVICE_ADDR
            - name: OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: OAUTH_ISSUER
            - name: OAUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: OAUTH_JWKS_URL
            # Where the installation is, as other servers are told. Worked out
            # from DOMAIN_NAME and ENV when the PUBLIC_ ones are not set.
            - name: DOMAIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: DOMAIN_NAME
            - name: PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_DOMAIN
                  optional: true
            - name: PUBLIC_WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_WEB_URL
                  optional: true
            - name: PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_API_URL
                  optional: true
            # What the private half of each person's signing key is kept
            # under: the same as auth-service's secrets.
            - name: CRYPT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: CRYPT_BACKEND
                  optional: true
            - name: CRYPT_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: CRYPT_LOCAL_KEY
                  optional: true
            - name: AWS_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: AWS_KMS_KEY_ID
                  optional: true
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: DSN
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: grpc-tls
              mountPath: /run/secrets/grpc
              readOnly: true
      volumes:
        # The certificate this service presents when it calls a gRPC
        # service, from k8s/base/grpc-tls.yml.
        - name: grpc-tls
          secret:
            secretName: anahita-grpc-client
---
apiVersion: v1
kind: Service
metadata:
  name: activitypub-service
spec:
  selector:
    app: activitypub-service
  ports:
    - name: http
      port: 80
      targetPort: http
