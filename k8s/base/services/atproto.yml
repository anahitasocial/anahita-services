# atproto-service: Bluesky. Somebody here looks up an account there and follows it, and its posts are kept here; whoever connects their own Bluesky account also posts, replies, likes, reposts and follows there. Optional: an installation that leaves it out follows nobody there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atproto-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atproto-service
  template:
    metadata:
      labels:
        app: atproto-service
    spec:
      containers:
        - name: atproto-service
          image: anahita/atproto-service
          ports:
            - name: http
              containerPort: 80
          env:
            # Only a site that is open to read writes anything to Bluesky,
            # as only one that is federates. The same for every service.
            - name: SITE_READ_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: SITE_READ_ACCESS
                  optional: true
            # How many images a photo post may hold: 20 unless fewer.
            - name: PHOTO_MAX_FILES
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PHOTO_MAX_FILES
                  optional: true
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ENV
            # Mutual TLS on the calls to the gRPC services. Unset means on,
            # except with ENV=dev.
            - name: GRPC_TLS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: GRPC_TLS
                  optional: true
            - name: AMQP_ADDR
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: AMQP_ADDR
            - name: SECURE_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: SECURE_COOKIE_KEY
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REDIS_ADDR
            - name: REDIS_TLS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REDIS_TLS
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: FILE_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: FILE_SERVICE_ADDR
            - name: GRAPH_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: GRAPH_SERVICE_ADDR
            # For the card of a link in a post from Bluesky. Take it
            # out where link-preview-service is not deployed.
            - name: LINK_PREVIEW_URL
              value: http://link-preview-service
            - name: OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: OAUTH_ISSUER
            - name: OAUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: OAUTH_JWKS_URL
            # Who is asking, as Bluesky is told. Worked out from DOMAIN_NAME
            # and ENV when the PUBLIC_ ones are not set.
            - name: DOMAIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: DOMAIN_NAME
            - name: PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_DOMAIN
                  optional: true
            - name: PUBLIC_WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_WEB_URL
                  optional: true
            - name: PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: PUBLIC_API_URL
                  optional: true
            # Where Bluesky is read from. Unset for the network's own. See
            # docs/configuration.md, Federation (and docs/federation.md).
            - name: ATPROTO_APPVIEW_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ATPROTO_APPVIEW_URL
                  optional: true
            - name: ATPROTO_JETSTREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ATPROTO_JETSTREAM_URL
                  optional: true
            - name: ATPROTO_CDN_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ATPROTO_CDN_URL
                  optional: true
            - name: ATPROTO_PLC_URL
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: ATPROTO_PLC_URL
                  optional: true
            # What the token of each connected Bluesky account is kept under:
            # the same as auth-service's secrets. Without a key Bluesky is read
            # and nothing is written to it.
            - name: CRYPT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: CRYPT_BACKEND
                  optional: true
            - name: CRYPT_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: CRYPT_LOCAL_KEY
                  optional: true
            - name: AWS_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: AWS_KMS_KEY_ID
                  optional: true
            # How many days the pictures of a post from elsewhere are kept
            # after the post was last touched. Unset for thirty; 0 to keep
            # them for good.
            - name: REMOTE_MEDIA_DAYS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REMOTE_MEDIA_DAYS
                  optional: true
            # How many days the posts of somebody nobody here follows any
            # more are kept. Unset for thirty; 0 to keep them for good.
            - name: REMOTE_UNFOLLOWED_DAYS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REMOTE_UNFOLLOWED_DAYS
                  optional: true
            # Posts from elsewhere removed whoever wrote them, by age and
            # by how many are kept of one person. Off unless set: what
            # they remove is not got back by asking.
            - name: REMOTE_POSTS_DAYS
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REMOTE_POSTS_DAYS
                  optional: true
            - name: REMOTE_POSTS_KEPT
              valueFrom:
                configMapKeyRef:
                  name: anahita-config
                  key: REMOTE_POSTS_KEPT
                  optional: true
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: DSN
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: grpc-tls
              mountPath: /run/secrets/grpc
              readOnly: true
      volumes:
        # The certificate this service presents when it calls a gRPC
        # service, from k8s/base/grpc-tls.yml.
        - name: grpc-tls
          secret:
            secretName: anahita-grpc-client
---
apiVersion: v1
kind: Service
metadata:
  name: atproto-service
spec:
  selector:
    app: atproto-service
  ports:
    - name: http
      port: 80
      targetPort: http
