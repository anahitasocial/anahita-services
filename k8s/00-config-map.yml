apiVersion: v1
kind: ConfigMap
metadata:
  name: anahita-config-map
data:
  ENV: "dev"
  DSN: "root:root@(mysql-svc:3306)/anahita?parseTime=true"
  AWS_PROFILE: "anahitapolis"
  AWS_DEFAULT_REGION: "ca-central-1"
  AWS_FILES_S3_BUCKET: "staging.anahita.io"
  AWS_FILES_S3_ASSETS_DIR: "assets/v2"
  AWS_KMS_KEY_ID: ""
  # Secrets-at-rest encryption backend: "local" or "kms". Local needs
  # only the CRYPT_LOCAL_KEY secret; kms needs AWS_KMS_KEY_ID above.
  CRYPT_BACKEND: "local"
  AMQP_ADDR: "amqp://rabbitmq:5672"
  MYSQL_USER: "root"
  MYSQL_DATABASE: "anahita"
  # SMTP is the only mail transport. Mailgun stays the supplier here, reached
  # through its SMTP relay rather than its HTTP API — swapping to SES,
  # Postmark or an internal MTA is now a change to these three values.
  #
  # NOTE: the SMTP password in anahita-secret is NOT the Mailgun API key. It is
  # the SMTP credential from the Mailgun domain settings; they are different
  # values and the API key will not authenticate here.
  SMTP_USER: postmaster@mail.anahita.io
  SMTP_HOST: smtp.mailgun.org
  SMTP_PORT: "587"
  # false: connect in the clear on 587 and upgrade with STARTTLS, which is
  # what Mailgun expects there. true would mean implicit TLS on 465.
  SMTP_SECURE: "false"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  my.cnf: |
    [mysqld]
    group_concat_max_len = 64000
