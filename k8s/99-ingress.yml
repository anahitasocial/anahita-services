apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anahita-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service-svc
            port:
              number: 80
      - path: /whoami
        pathType: Prefix
        backend:
          service:
            name: auth-service-svc
            port:
              number: 80
      - path: /signup
        pathType: Prefix
        backend:
          service:
            name: auth-service-svc
            port:
              number: 80
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: auth-service-svc
            port:
              number: 80
      - path: /people
        pathType: Prefix
        backend:
          service:
            name: person-service-svc
            port:
              number: 80
      - path: /groups
        pathType: Prefix
        backend:
          service:
            name: group-service-svc
            port:
              number: 80
      - path: /notes
        pathType: Prefix
        backend:
          service:
            name: note-service-svc
            port:
              number: 80
      - path: /articles
        pathType: Prefix
        backend:
          service:
            name: article-service-svc
            port:
              number: 80
      - path: /photos
        pathType: Prefix
        backend:
          service:
            name: photo-service-svc
            port:
              number: 80
      - path: /topics
        pathType: Prefix
        backend:
          service:
            name: topic-service-svc
            port:
              number: 80
      - path: /hashtags
        pathType: Prefix
        backend:
          service:
            name: hashtag-service-svc
            port:
              number: 80
      - path: /locations
        pathType: Prefix
        backend:
          service:
            name: location-service-svc
            port:
              number: 80
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service-svc
            port:
              number: 80
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: search-service-svc
            port:
              number: 80
      - path: /socialgraph
        pathType: Prefix
        backend:
          service:
            name: socialgraph-service-svc
            port:
              number: 80
      - path: /stories
        pathType: Prefix
        backend:
          service:
            name: story-service-svc
            port:
              number: 80
