# The identity file-grpc-service runs as. EKS exchanges it for the IAM role
# named here, which needs s3:GetObject, s3:PutObject and s3:DeleteObject on
# the bucket's objects, and s3:ListBucket on the bucket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-grpc-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/anahita-files
