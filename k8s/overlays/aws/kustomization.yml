# Amazon EKS, with S3 for uploads, RDS for MySQL and ElastiCache for Redis.
#
# file-grpc-service signs in to S3 with an IAM role given to its pod (IRSA),
# so there are no storage keys to keep. RabbitMQ still runs in the cluster.
# docs/deploying.md has the details.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anahita

resources:
  - namespace.yml
  - issuer.yml
  - service-accounts.yml
  - ../../base

components:
  - ../../components/rabbitmq

patches:
  - path: ingress.yml
  - path: file-grpc-role.yml

configMapGenerator:
  - name: anahita-config
    behavior: merge
    envs:
      - config.env
  - name: anahita-oauth-clients
    files:
      - oauth_seed_clients.json

secretGenerator:
  - name: anahita-secrets
    envs:
      - secrets.env

# Which build to run. Pin newTag to a release, and add newName to pull from
# ECR or another registry of your own.
images:
  - name: anahita/abuse-report-service
    newTag: latest
  - name: anahita/activitypub-service
    newTag: latest
  - name: anahita/atproto-service
    newTag: latest
  - name: anahita/actor-service
    newTag: latest
  - name: anahita/auth-service
    newTag: latest
  - name: anahita/feed-service
    newTag: latest
