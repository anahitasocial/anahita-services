# Any Kubernetes cluster, any S3-compatible object store.
#
# Copy this directory, fill in config.env, secrets.env (from the example),
# ingress.yml, issuer.yml and oauth_seed_clients.json, then:
#   kubectl --kubeconfig ~/.kube/<your-site>.yaml apply -k k8s/overlays/generic
# docs/deploying.md walks through it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anahita

resources:
  - namespace.yml
  - issuer.yml
  - ../../base

# The backing services, run inside the cluster. Remove a line to use a
# managed one instead, and point config.env and secrets.env at it.
components:
  - ../../components/mysql
  - ../../components/redis
  - ../../components/rabbitmq

patches:
  - path: ingress.yml

configMapGenerator:
  - name: anahita-config
    behavior: merge
    envs:
      - config.env
  - name: anahita-oauth-clients
    files:
      - oauth_seed_clients.json

secretGenerator:
  - name: anahita-secrets
    envs:
      - secrets.env

# Which build to run: the images of a Birth release, from GitHub's registry
# (docs/deploying.md, Images). latest is the newest release, for trying
# Anahita out; a site pins newTag to the version it runs, the same on every
# line. Change newName to pull from a registry of your own.
images:
  - name: anahita/abuse-report-service
    newName: ghcr.io/anahitasocial/abuse-report-service
    newTag: latest
