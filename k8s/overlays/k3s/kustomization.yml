# One server running k3s, at any provider, or a machine of your own.
#
# Copy this directory, fill in config.env, secrets.env (from the example),
# ingress.yml, issuer.yml and oauth_seed_clients.json, then:
#   kubectl apply -k k8s/overlays/k3s
# docs/deploying-k3s.md walks through it, from choosing the server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anahita

resources:
  - namespace.yml
  - issuer.yml
  - ../../base

# Everything on the one server. Remove garage where the provider sells an
# S3-compatible store, and point config.env and secrets.env at it.
components:
  - ../../components/traefik
  - ../../components/mysql
  - ../../components/mysql-backup
  - ../../components/redis
  - ../../components/rabbitmq
  - ../../components/garage

patches:
  - path: ingress.yml

configMapGenerator:
  - name: anahita-config
    behavior: merge
    envs:
      - config.env
  - name: anahita-oauth-clients
    files:
      - oauth_seed_clients.json

secretGenerator:
  - name: anahita-secrets
    envs:
      - secrets.env

# Which build to run. Pin newTag to a release, and add newName to pull from
# a registry of your own.
images:
  - name: anahita/abuse-report-service
    newTag: latest
  - name: anahita/activitypub-service
    newTag: latest
  - name: anahita/atproto-service
    newTag: latest
  - name: anahita/actor-service
    newTag: latest
  - name: anahita/auth-service
    newTag: latest
