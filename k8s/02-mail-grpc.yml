apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-grpc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-grpc-service
  template:
    metadata:
      labels:
        app: mail-grpc-service
    spec:
      containers:
      - name: mail-grpc-service
        image: anahita/mail-grpc-service:0.9.0
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: ENV
        - name: MAILER_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: MAILER_PROVIDER
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: SMTP_PORT
        - name: SMTP_USER
          valueFrom:
            configMapKeyRef:
              name: anahita-config-map
              key: SMTP_USER
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: anahita-secret
              key: SMTP_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: mail-grpc-service-svc
spec:
  type: ClusterIP
  selector:
    app: mail-grpc-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
