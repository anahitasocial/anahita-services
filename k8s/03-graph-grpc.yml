apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-grpc-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: graph-grpc-service
  template:
    metadata:
      labels:
        app: graph-grpc-service
    spec:
      containers:
        - name: graph-grpc-service
          image: "anahita/graph-grpc-service:0.9.0"
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: anahita-config-map
                  key: ENV
            - name: DSN
              valueFrom:
                configMapKeyRef:
                  name: anahita-config-map
                  key: DSN
            - name: AMQP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: anahita-config-map
                  key: AMQP_ADDR
---
apiVersion: v1
kind: Service
metadata:
  name: graph-grpc-service-svc
spec:
  type: ClusterIP
  selector:
    app: graph-grpc-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP

