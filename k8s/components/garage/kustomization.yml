# Garage, an S3-compatible store, on the cluster itself: for a server whose
# provider sells no object storage. Leave it out where there is a bucket.
#
# Needs in anahita-secrets: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN, and the
# STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY it is to accept. garage-init.yml
# gives the node its role, imports that key and makes STORAGE_BUCKET.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - garage.yml
  - garage-init.yml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
