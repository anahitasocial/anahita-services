# One node, one copy of everything, SQLite for its metadata. The two secrets
# come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), not
# from this file. https://garagehq.deuxfleurs.fr/documentation/
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Every S3 request is signed for a region; STORAGE_REGION must match this.
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
