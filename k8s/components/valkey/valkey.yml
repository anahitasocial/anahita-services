# Valkey inside the cluster, for sessions and rate limits: the open-source
# (BSD) Redis, in Redis's place since roadmap row 165. Sessions are kept on a
# volume so a restart does not sign everybody out.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.2-alpine
          # Asks for a password only when VALKEY_PASSWORD is set, so it always
          # matches what the services are given.
          command:
            - sh
            - -c
            - exec valkey-server --maxmemory-policy noeviction --appendonly yes ${VALKEY_PASSWORD:+--requirepass "$VALKEY_PASSWORD"}
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anahita-secrets
                  key: VALKEY_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
