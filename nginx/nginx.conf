user  nginx;

events {
    worker_connections   1000;
}

http {
    client_max_body_size 10M;

    map $http_origin $cors_origin {
        "http://localhost:3000" "http://localhost:3000";
        default "";
    }

    upstream auth-service {
        server auth-service:80;
    }

    upstream group-service {
        server group-service:80;
    }

    upstream person-service {
        server person-service:80;
    }

    upstream text-service {
        server text-service:80;
    }

    upstream photo-service {
        server photo-service:80;
    }

    upstream hashtag-service {
        server hashtag-service:80;
    }

    upstream location-service {
        server location-service:80;
    }

    upstream story-service {
        server story-service:80;
    }

    upstream notification-service {
        server notification-service:80;
    }

    upstream socialgraph-service {
        server socialgraph-service:80;
    }

    upstream search-service {
        server search-service:80;
    }

    upstream comment-service {
        server comment-service:80;
    }

    upstream like-service {
        server like-service:80;
    }

    upstream avatar-service {
        server avatar-service:80;
    }

    upstream cover-service {
        server cover-service:80;
    }

    upstream feed-service {
        server feed-service:80;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 32k;

        # Inherited only by locations that declare no proxy_set_header of
        # their own. Every location below re-declares the full set, because
        # nginx discards the whole inherited group as soon as a location
        # sets a single header itself.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-OAuth-Token "";

        # Turns the first-party session cookie into an access token.
        #
        # auth-service answers 200 whether or not the caller is
        # authenticated, setting X-OAuth-Token only when it holds a valid
        # token — so this gate identifies callers without rejecting
        # anonymous ones. Routes that must refuse anonymous callers do so
        # in the service, via the Authorize middleware.
        location = /internal/oauth/validate {
            internal;
            proxy_pass http://auth-service/oauth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-OAuth-Token "";
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }

        # ---- auth-service ----

        location = /oauth/userinfo {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /oauth/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /auth {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        # Signup is a server-rendered page on auth-service now, not a JSON
        # endpoint the web app posts to. No CORS block: the browser navigates
        # here, it does not fetch.
        location /signup {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            proxy_pass http://auth-service;
        }

        # The signup-request queue's administration API. JSON, and the web app's
        # settings screen is what calls it.
        location /signup-requests {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            # The browser holds a session cookie, not a token. This asks
            # auth-service to turn one into the other, and the Bearer header
            # below is what the service actually authenticates on — without
            # these three lines every request arrives with no credentials and
            # is refused, however validly the person is signed in.
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /agreements {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            # The browser holds a session cookie, not a token. This asks
            # auth-service to turn one into the other, and the Bearer header
            # below is what the service actually authenticates on — without
            # these three lines every request arrives with no credentials and
            # is refused, however validly the person is signed in.
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /static/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            proxy_pass http://auth-service;
        }

        # openid-configuration, jwks.json and nodeinfo are discovery
        # documents their specifications require to be world-readable. A
        # relying party validating our tokens, or another server asking
        # what we run, is by definition not in an allow-list we keep.
        #
        # Open to any origin for the same reason as /nodeinfo/ below, and
        # WITHOUT credentials on purpose: none of these reads the session,
        # and a browser refuses a credentialed request against a wildcard
        # origin. The web app fetches them with an instance that sends no
        # cookies - see src/api/publicClient.js.
        #
        # Missing this header, they were unreachable from the dev server
        # on :3000 altogether, which took out the login page, /support,
        # the settings About tab and the invite level the left menu gates
        # on. Same-origin production never hit it.
        location /.well-known/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://auth-service;
        }

        # NodeInfo's second hop. /.well-known/nodeinfo above is only a list of
        # links; this is the document they point at, and it lives outside
        # /.well-known/ because the protocol puts it there.
        #
        # CORS is open to any origin on purpose. NodeInfo is read by other
        # servers and by fediverse directory sites, none of which are in our
        # allow-list and all of which are meant to be able to read it.
        location /nodeinfo/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://auth-service;
        }

        location /auth-logs/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /clients {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /invites {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /oauth-signing-keys {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /password {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        # Step-up re-authentication.
        #
        # Same shape as /webauthn below, and for the same reason: these
        # are authenticated calls that carry no Authorization header of
        # their own, so the auth_request gate is what turns the session
        # cookie into a bearer token upstream.
        #
        # Prefix, not exact, because the passkey ceremony is three
        # paths: /reauth/password, /reauth/passkey/begin, and
        # /reauth/passkey/finish.
        #
        # A missing block here does not read as a missing route. With no
        # catch-all location in this server, an unmatched path is
        # answered by nginx itself, and that response carries none of
        # the Access-Control-Allow-Origin headers added below — so the
        # browser reports a CORS failure on a request that never reached
        # auth-service at all.
        location /reauth {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        # Username change. Authenticated only — one endpoint, no public
        # confirm pages, because a handle move relocates no recovery
        # path and so needs nothing approved from the person's mailbox.
        location /username {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        # Email change. Two different audiences behind one prefix:
        #
        #   PATCH /email/change          — the SPA, authenticated
        #   GET|POST /email/change/confirm — a browser following a link
        #                                    from the person's mailbox
        #
        # Both belong here. The auth_request gate identifies a caller
        # without rejecting an anonymous one (auth-service answers 200
        # either way and only sets X-OAuth-Token when it holds a valid
        # token), so the confirm pages still work on a device with no
        # session — which is the normal case, since the link is opened
        # wherever the person reads their mail. auth-service applies
        # authorize to PATCH /email/change alone.
        #
        # Prefix without a trailing slash: /email/ would not match a
        # request for /email, and more to the point the style here should
        # match /password and /reauth rather than the resource services.
        location /email {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        # Prefix WITHOUT a trailing slash, unlike the resource services
        # below. /totp/ would not match a request for /totp, and with no
        # catch-all location in this server that request is answered by
        # nginx itself — a 404 carrying none of the CORS headers added
        # here, which the browser reports as a CORS failure on a request
        # that never reached auth-service.
        #
        # Not hypothetical: POST /totp starts enrolment and PATCH /totp
        # enables it, so the trailing slash took out the whole 2FA
        # wizard. GET /totp (status) and the deeper /totp/... routes are
        # all covered by dropping it.
        location /totp {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /webauthn {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
