user  nginx;

events {
    worker_connections   1000;
}

http {
    client_max_body_size 10M;

    map $http_origin $cors_origin {
        "http://localhost:3000" "http://localhost:3000";
        default "";
    }

    upstream auth-service {
        server auth-service:80;
    }

    upstream group-service {
        server group-service:80;
    }

    upstream person-service {
        server person-service:80;
    }

    upstream text-service {
        server text-service:80;
    }

    upstream photo-service {
        server photo-service:80;
    }

    upstream hashtag-service {
        server hashtag-service:80;
    }

    upstream location-service {
        server location-service:80;
    }

    upstream story-service {
        server story-service:80;
    }

    upstream notification-service {
        server notification-service:80;
    }

    upstream socialgraph-service {
        server socialgraph-service:80;
    }

    upstream search-service {
        server search-service:80;
    }

    upstream comment-service {
        server comment-service:80;
    }

    upstream like-service {
        server like-service:80;
    }

    upstream avatar-service {
        server avatar-service:80;
    }

    upstream cover-service {
        server cover-service:80;
    }

    upstream feed-service {
        server feed-service:80;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 32k;

        # Inherited only by locations that declare no proxy_set_header of
        # their own. Every location below re-declares the full set, because
        # nginx discards the whole inherited group as soon as a location
        # sets a single header itself.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-OAuth-Token "";

        # Turns the first-party session cookie into an access token.
        #
        # auth-service answers 200 whether or not the caller is
        # authenticated, setting X-OAuth-Token only when it holds a valid
        # token — so this gate identifies callers without rejecting
        # anonymous ones. Routes that must refuse anonymous callers do so
        # in the service, via the Authorize middleware.
        location = /internal/oauth/validate {
            internal;
            proxy_pass http://auth-service/oauth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-OAuth-Token "";
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }

        # ---- auth-service ----

        location = /oauth/userinfo {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Cookie' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-OAuth-Token "";
            auth_request /internal/oauth/validate;
            auth_request_set $oauth_token $upstream_http_x_oauth_token;
            proxy_set_header Authorization "Bearer $oauth_token";
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://auth-service;
        }

        location /oauth/ {
