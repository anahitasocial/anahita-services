# The federation lab's front door: https, at three names, on one machine.
#
#   api.anahita.test   the API, as other servers reach it  -> the gateway
#   anahita.test       the web app's host                  -> the web shell
#   gts.test           another server to talk to           -> GoToSocial
#
# The containers on the network know this one by all three names, so each
# server reaches the other the way two servers on the internet would: by
# name, over https, through a certificate it has reason to trust.
#
# For local development only. See docs/federation-lab.md.

events {}

http {
    # Docker's own resolver, asked at the time of each request: this starts
    # whether or not the web shell or GoToSocial are running, and answers 502
    # for the one that is not.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    client_max_body_size 40m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    server {
        listen 443 ssl;
        server_name api.anahita.test;

        location / {
            set $gateway http://nginx:80;
            proxy_pass $gateway;
        }
    }

    server {
        listen 443 ssl;
        server_name anahita.test;

        # What other servers ask the web app's host, sent on to the API. The
        # web shell does this itself; said here too so that the lab works
        # without it.
        location /.well-known/ {
            add_header Access-Control-Allow-Origin * always;
            return 302 https://api.anahita.test$request_uri;
        }

        location / {
            set $shell http://web-shell:80;
            proxy_pass $shell;
        }
    }

    server {
        listen 443 ssl;
        server_name gts.test;

        location / {
            set $gts http://gotosocial:8080;
            proxy_pass $gts;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }
}
