syntax = "proto3";

package graph;

option go_package = "/graphpb";

import "proto/graphpb/context.proto";
import "proto/graphpb/node.proto";

message FeedLeadersCountRequest {
    // 1 was include_comments. Comments became replies, which a feed leaves
    // out.
    reserved 1;
    bool include_reposts = 2;
    bool include_liked = 3;
    repeated string leader_entity_types = 4;
    repeated string medium_entity_types = 5;
    Viewer viewer = 6;
}

message FeedLeadersCountResponse {
    uint64 total = 1;
}

message FeedLeadersBrowseRequest {
    // 1 was include_comments. Comments became replies, which a feed leaves
    // out.
    reserved 1;
    bool include_reposts = 2;
    bool include_liked = 3;
    repeated string leader_entity_types = 4;
    repeated string medium_entity_types = 5;
    uint64 limit = 6;
    uint64 offset = 7;
    Viewer viewer = 8;
}

message FeedLeadersBrowseResponse {
    repeated Node nodes = 1;
}

// Which of the actors the viewer follows have posted lately.
message FeedLeadersActiveRequest {
    // How far back, in hours.
    uint32 hours = 1;
    uint32 limit = 2;
    repeated string medium_entity_types = 3;
    Viewer viewer = 4;
}

message ActiveLeader {
    int64 actor_id = 1;
    // When the newest of their posts in the window was made, as seconds
    // since the epoch, and how many there are that the viewer may see.
    int64 latest_at = 2;
    uint64 count = 3;
}

message FeedLeadersActiveResponse {
    repeated ActiveLeader leaders = 1;
}

service FeedLeadersService {
    rpc Count(FeedLeadersCountRequest) returns (FeedLeadersCountResponse);
    rpc Browse(FeedLeadersBrowseRequest) returns (FeedLeadersBrowseResponse);
    rpc Active(FeedLeadersActiveRequest) returns (FeedLeadersActiveResponse);
}
