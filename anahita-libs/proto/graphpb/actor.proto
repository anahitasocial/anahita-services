syntax = "proto3";

package graph;

option go_package = "/graphpb";

import "proto/graphpb/context.proto";
import "proto/graphpb/node.proto";

message Actors {
    repeated Node actors = 1;
}

message ActorCountRequest {
    repeated string types = 1;
    string search = 2;
    Viewer viewer = 3;
    bool access_check = 4;
    // Only featured actors. Count and Browse must agree on this, or the
    // pagination total describes a different list from the page.
    bool featured = 5;
    // As on ActorBrowseRequest. The two must agree.
    bool include_askable = 6;
}

message ActorCountResponse {
    uint64 total = 1;
}

message ActorBrowseRequest {
    repeated string types = 1;
    string ordering = 2;
    string direction = 3;
    uint64 limit = 4;
    uint64 offset = 5;
    string search = 6;
    Viewer viewer = 7;
    bool access_check = 8;
    // Only featured actors — the accounts onboarding offers to follow. With no
    // ordering, most recently featured first.
    bool featured = 9;
    // Also list the actors the viewer may not see but may ask to follow.
    // They come back marked restricted, with their name and picture only.
    bool include_askable = 10;
}

message ActorBrowseResponse {
    repeated Node actors = 1;
}

message ActorReadRequest {
    int64 id = 1;
    Viewer viewer = 2;

    // The exact type the caller expects, e.g.
    // "node.actor.group-service.group.v1".
    //
    // Optional. Empty means "any actor", which is what the read falls back to
    // — the server always restricts to the node.actor. family regardless, so
    // an id belonging to a hashtag or a photo can never come back here.
    //
    // Set it when the route already determines the entity: /groups/:id means a
    // group, and without this a person's id served under that path returned a
    // person, with a response shape the client never asked for.
    string node_type = 3;
}

message ActorReadResponse {
    Node actor = 1;
}

message ActorBatchReadRequest {
    repeated int64 ids = 1;
    string ordering = 2;
    string direction = 3;
    Viewer viewer = 4;
}

message ActorBatchReadResponse {
    repeated Node actors = 1;
}

message ActorEditRequest {
    Node actor = 1;
    Viewer viewer = 2;
}

message ActorEditResponse {
    Node actor = 1;
}

message ActorAddRequest {
    Node actor = 1;
    Viewer viewer = 2;
}

message ActorAddResponse {
    Node actor = 1;
}

message ActorDeleteRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message ActorRestoreRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message ActorRestoreResponse {
    // False when there was nothing to restore — already purged, or never
    // deleted. The caller needs to tell that from success.
    bool restored = 1;
}

message ActorDeleteResponse {
    Node actor = 1;
}

// What a person loses by deleting their profile, in numbers.
//
// The Danger zone described the consequences in the abstract — "your posts
// will be removed" — which reads as boilerplate. Naming the actual figures is
// what makes somebody stop and think, so this exists to be shown BEFORE the
// deletion, not to report on it afterwards.
//
// Counts, not a list: the point is the weight of it, and a profile with
// thousands of posts cannot be enumerated into a dialog anyway.
//
// The figures describe WHAT DELETING DESTROYS, which is not the same as what
// the actor wrote — a post made into a group is owned by the group and
// survives; a reply somebody else left under their post does not. See the
// repository implementation.
message ActorDeletionCountsRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message ActorDeletionCountsResponse {
    // Media authored by this actor, anywhere — their own profile and every
    // group they posted into.
    int64 posts = 1;

    // Replies that go: the ones they wrote, wherever they are, and the ones
    // other people wrote under their posts. Deleting the profile takes these
    // too, which is the part people do not expect.
    int64 replies = 2;

    // Actors following them, and actors they follow. Both directions, because
    // losing an audience and losing a feed are different losses.
    int64 followers = 3;
    int64 following = 4;

    // Who administers this actor. Meaningful for a group — deleting one takes
    // a shared space away from everybody running it — and zero for a person.
    int64 admins = 7;

    // What this actor administers. The mirror of the above, read from the
    // other end of the same edge: meaningful for a person, zero for a group.
    // The one that most often changes somebody's mind, since a group left with
    // no other administrator has nobody who can run it.
    int64 groups_administered = 5;

    // When they joined, so the dialog can say how long this account has been
    // theirs. Zero when unknown rather than an epoch date.
    int64 member_since_unix = 6;
}

// Ask for actors, and everything they owned or wrote, to be destroyed now,
// with no grace period.
//
// Super administrators only, and the authority check lives in the calling
// service — graph-grpc has no notion of a usertype. What it does enforce is
// that this is not reachable by accident: a distinct RPC rather than a flag on
// Delete, so nothing that means "schedule for deletion" can be made to mean
// "destroy immediately" by setting a boolean.
//
// The answer comes before the work is done. Each actor is hidden at once and
// queued; ReadPurgeBatch reports how far the queue has got.
message ActorPurgeBatchRequest {
    repeated int64 ids = 1;
    // The full node type every id must have, so a route for people cannot be
    // used on a group.
    string type = 2;
    // False refuses the whole request if any of the actors is an
    // administrator or super administrator. A bulk cleanup sets it false; the
    // deliberate removal of one named account sets it true.
    bool allow_administrators = 3;
    Viewer viewer = 4;
    // Why, when it is a moderator's decision rather than a cleanup: "spam",
    // recorded as removed-as-spam with who decided (roadmap row 102). Empty
    // for a cleanup.
    string reason = 5;
}

// Why one actor stopped a request.
message ActorPurgeRefusal {
    int64 id = 1;
    // not_found, wrong_type, administrator, yourself or
    // last_super_administrator.
    string reason = 2;
}

message ActorPurgeBatchResponse {
    // Empty when the request was refused: nothing was queued.
    string batch_id = 1;
    int64 queued = 2;
    // Already purged, or already queued by an earlier request.
    int64 skipped = 3;
    repeated ActorPurgeRefusal refused = 4;
}

message ActorPurgeBatchReadRequest {
    string batch_id = 1;
}

message ActorPurgeItem {
    int64 id = 1;
    string alias = 2;
    // queued, done or failed.
    string status = 3;
    string error = 4;
}

message ActorPurgeBatchReadResponse {
    string batch_id = 1;
    int64 total = 2;
    int64 queued = 3;
    int64 done = 4;
    int64 failed = 5;
    repeated ActorPurgeItem items = 6;
}

// What is public on the installation, counted by kind. Asked before
// MakePublicRegistered, to say what it would change, and answered by it, to
// say what it did.
message PublicAccessCountsRequest {}

message PublicAccessCountsResponse {
    int64 people = 1;
    int64 groups = 2;
    // Posts of every kind, and their revisions.
    int64 posts = 3;
}

message MakePublicRegisteredRequest {
    Viewer viewer = 1;
}

// Archive an actor. Permanent, and destroys nothing.
//
// There is no unarchive. Archiving is for an actor that is finished — a group
// whose project ended, a person who has left or died — and an undo would make
// it the soft option people reach for instead of thinking. That friction is
// the design.
message ActorArchiveRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message ActorArchiveResponse {
    // False when there was nothing to archive: already archived, deleted, or
    // absent. The caller needs to tell that from success.
    bool archived = 1;
}

// Turn an actor on or off. Reversible, and the counterpart to archiving.
//
// Its own RPC rather than a field on Edit, because `enabled` was carrying
// three meanings at once and this is the one that is genuinely a switch.
message ActorSetEnabledRequest {
    int64 id = 1;
    bool enabled = 2;
    Viewer viewer = 3;
}

message ActorSetEnabledResponse {
    // False when nothing changed — already in that state, or deleted.
    bool changed = 1;
}

// Change a person's type: registered, administrator or super-administrator.
//
// Its own RPC rather than a field on Edit, for the reason SetEnabled gives:
// person_type is an authority level, not a profile field, and Edit writes the
// whole actor from the payload it is handed. SUPER ADMINISTRATORS ONLY, and
// the caller enforces that, as with SetFeatured.
//
// What this service does enforce is the floor: nobody changes their own type
// (refused with "own_person_type"), so the last super administrator can never
// be demoted, there being nobody else who may. Only a person here, not
// deleted, can be changed (refused with "not_a_person").
message ActorSetPersonTypeRequest {
    int64 id = 1;
    string person_type = 2;
    Viewer viewer = 3;
}

message ActorSetPersonTypeResponse {
    // False when nothing changed: already of that type.
    bool changed = 1;
    // The type before, whether or not it changed.
    string previous = 2;
}

// Feature or unfeature an actor: the accounts onboarding offers a new member
// to follow.
//
// Its own RPC rather than a field on Edit, for the reason SetEnabled gives:
// Edit writes the whole actor from the payload it is handed, and featuring is a
// statement by the installation, not a change the actor makes to themselves.
// SUPER ADMINISTRATORS ONLY, and the caller enforces that — graph-grpc has no
// notion of a usertype.
//
// A disabled, archived or deleted actor cannot be featured, and the refusal is
// an error carrying "not_featurable" so the caller can answer 409.
message ActorSetFeaturedRequest {
    int64 id = 1;
    bool featured = 2;
    Viewer viewer = 3;
}

message ActorSetFeaturedResponse {
    // False when nothing changed — already featured, or already not.
    bool changed = 1;
}

// TouchLastVisit stamps nodes.last_visited_at with the current time.
//
// Its own RPC rather than an Edit, because Edit writes the whole actor from
// the payload it is handed and publishes an "actor edited" event. Routing a
// login through that would republish every actor to search and the feeds on
// every sign-in, and would let a stale read overwrite a profile as a side
// effect of somebody signing in.
//
// No viewer: the person is signing in as themselves, and there is no decision
// to make about whether they may. The caller has already authenticated them.
message ActorTouchLastVisitRequest {
    int64 id = 1;
}

message ActorTouchLastVisitResponse {
    // False when no row was stamped — no such actor, or it is deleted.
    bool changed = 1;
}

message ActorPingRequest {
    string message = 1;
}

message ActorPingResponse {
    string message = 1;
}

service ActorService {
    rpc Count(ActorCountRequest) returns (ActorCountResponse) {}
    rpc Browse(ActorBrowseRequest) returns (ActorBrowseResponse) {}
    rpc Read(ActorReadRequest) returns (ActorReadResponse) {}
    rpc BatchRead(ActorBatchReadRequest) returns (ActorBatchReadResponse) {}
    rpc Edit(ActorEditRequest) returns (ActorEditResponse) {}
    rpc Add(ActorAddRequest) returns (ActorAddResponse) {}
    rpc Delete(ActorDeleteRequest) returns (ActorDeleteResponse) {}
    // Reverses a Delete within the grace period. People restore themselves at
    // login; a group cannot, so its administrators restore it from the group's
    // own settings page, which is what this serves.
    rpc Restore(ActorRestoreRequest) returns (ActorRestoreResponse) {}
    // What deleting this actor would cost, for the confirmation dialog.
    rpc DeletionCounts(ActorDeletionCountsRequest) returns (ActorDeletionCountsResponse) {}
    // Queues actors to be destroyed now, skipping the grace period. Super
    // administrators only; the caller enforces that.
    rpc RequestPurge(ActorPurgeBatchRequest) returns (ActorPurgeBatchResponse) {}
    // How far a RequestPurge has got.
    rpc ReadPurgeBatch(ActorPurgeBatchReadRequest) returns (ActorPurgeBatchReadResponse) {}
    // How much on the installation is public: profiles, groups and posts.
    rpc PublicAccessCounts(PublicAccessCountsRequest) returns (PublicAccessCountsResponse) {}
    // Makes everything that is public visible to signed-in people only, in
    // one step, and records who did it. Super administrators only; the
    // caller enforces that. It cannot be undone.
    rpc MakePublicRegistered(MakePublicRegisteredRequest) returns (PublicAccessCountsResponse) {}
    // Archives an actor. Permanent; destroys nothing. No unarchive by design.
    rpc Archive(ActorArchiveRequest) returns (ActorArchiveResponse) {}
    // Turns an actor on or off. Reversible.
    rpc SetEnabled(ActorSetEnabledRequest) returns (ActorSetEnabledResponse) {}
    // Features or unfeatures an actor. Super administrators only; the caller
    // enforces that.
    rpc SetFeatured(ActorSetFeaturedRequest) returns (ActorSetFeaturedResponse) {}
    // A person's type. Super administrators only, enforced by the caller.
    rpc SetPersonType(ActorSetPersonTypeRequest) returns (ActorSetPersonTypeResponse) {}
    // Records that this actor just signed in.
    rpc TouchLastVisit(ActorTouchLastVisitRequest) returns (ActorTouchLastVisitResponse) {}
    rpc Ping(ActorPingRequest) returns (ActorPingResponse) {}
}
