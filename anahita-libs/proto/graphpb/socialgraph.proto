syntax = "proto3";

package graph;

option go_package = "/graphpb";

message Socialgraph {
    int64 actor_a_id = 1; // The ID of the first actor in the relationship
    int64 actor_b_id = 2; // The ID of the second actor in the relationship
    bool is_leading = 3;
    bool is_following = 4;
    bool is_mutual = 5;
    bool is_blocking = 6;
    bool has_admin = 7;
    // Actor B has asked to follow actor A, and has not been answered.
    bool has_requested = 8;
    // Actor B has been invited to follow actor A, and has not answered.
    bool has_invite = 9;
    // Actor A is an event that lets its host's followers in, and actor B
    // follows the group hosting it.
    bool via_host = 10;
    // Actor A mutes actor B, and the mute has not ended (roadmap row 133).
    bool is_muting = 11;
    // Actor A, muting actor B, is not told of what actor B does.
    bool mute_hides_notifications = 12;
    // When the mute ends, in Unix seconds; 0 for until unmuted.
    int64 mute_ends_at = 13;
}

message SocialgraphReadRequest {
    int64 actor_a_id = 1;
    int64 actor_b_id = 2;
}

message SocialgraphReadResponse {
    Socialgraph relation = 1;
}

message SocialgraphBrowseRequest {
    repeated int64 actor_a_ids = 1;
    int64 actor_b_id = 2;
}

message SocialgraphBrowseResponse {
    map<int64, Socialgraph> relations = 1; // key is actor_id
}

service SocialgraphService {
    rpc Read(SocialgraphReadRequest) returns (SocialgraphReadResponse);
    rpc Browse(SocialgraphBrowseRequest) returns (SocialgraphBrowseResponse);
}


