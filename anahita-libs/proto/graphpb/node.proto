syntax = "proto3";

package graph;

option go_package = "/graphpb";

import "proto/graphpb/context.proto";
import "google/protobuf/timestamp.proto";

message Node {
    int64 id = 1;
    string type = 2;
    string service = 3;
    bool enabled = 4;
    string access = 5;
    string name = 6;
    string alias = 7;
    string body = 8;
    string excerpt = 9;
    string filename = 10;
    string cover_filename = 11;
    string meta = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
    int64 follower_count = 16;
    int64 leader_count = 17;
    int64 subscriber_count = 19;
    bool comment_status = 20;
    int64 comment_count = 21;
    int64 likes_count = 22;
    bool is_liked_by_viewer = 24;
    int64 repost_count = 26;
    int64 quote_count = 27;
    string features_raw = 28;
    repeated NodeFeature features = 29;
    // 30 was `information`, the website/contact/phone map read out of the
    // legacy `meta` column. Replaced by website_url below. Reserved rather
    // than reused: a new field with this number would be decoded by older
    // peers as the old map.
    reserved 30;
    // Columns dropped from `nodes` on 2026-10-02 because nothing used them:
    // filesize (12), mutual_count (18), dislikes_count (23), last_comment_id,
    // last_comment_by, last_comment_on (47-49), ordering (50), is_default (53),
    // cover_filesize (68), cover_mimetype (69), status, status_update_time
    // (70-71) and timezone (73). Reserved for the same reason as 30.
    // 64 and 66 were created_at and updated_at, a second copy of the two
    // timestamps in fields 14 and 15 that was written and never read.
    reserved 12, 18, 23, 47 to 50, 53, 64, 66, 68 to 71, 73;
    Node owner = 31;
    Node parent = 32;
    Node author = 33;
    Node editor = 34;
    bool is_subscribed_by_viewer = 35;
    bool is_reposted_by_viewer = 36;
    bool is_quoted_by_viewer = 37;
    bool is_following_viewer = 38;
    bool is_leading_viewer = 39;
    bool is_blocked_by_viewer = 40;
    bool is_admined_by_viewer = 41;
    bool allow_follow_request = 42;
    google.protobuf.Timestamp starts_at = 43;
    google.protobuf.Timestamp ends_at = 44;
    string owner_type = 45;
    int64 owner_id = 46;
    bool verified = 51;
    bool pinned = 52;
    int64 view_count = 54;
    int64 parent_id = 55;
    string parent_type = 56;
    double geo_latitude = 57;
    double geo_longitude = 58;
    string geo_address = 59;
    string geo_city = 60;
    string geo_state_province = 61;
    string geo_country = 62;
    string geo_postalcode = 63;
    int64 created_by = 65;
    int64 modified_by = 67;
    string mimetype = 72;
    string language = 74;
    int64 edge_count = 75;

    // Set when the actor is scheduled for deletion, absent otherwise.
    //
    // Deleting also clears `enabled`, so a client that only reads that cannot
    // tell an account on its way out from one an administrator disabled — and
    // those want opposite treatment. The group settings page needs the
    // difference to offer Restore rather than the delete form.
    google.protobuf.Timestamp deleted_at = 76;

    // One link on an actor profile.
    //
    // Replaces the website/contact/phone values that used to be read out of
    // the `information` map above — nothing ever populated that map in this
    // stack, so those fields have always rendered empty.
    string website_url = 77;

    // A person's authority on the installation: guest, registered,
    // administrator or super-administrator.
    //
    // Named for the node rather than for auth, because the graph owns the
    // person and has no notion of a "user" — that word is reserved for
    // protocol surface an external specification names that way. Unlike
    // owner_type and parent_type it holds an authority level, not a node type
    // string.
    string person_type = 78;

    // Free text, e.g. "she/her", "iel". Never an enum: an enum hard-codes
    // English grammar and is meaningless in a language with no gendered
    // third-person pronoun. Display only — never read for logic, and empty
    // renders nothing.
    string person_pronouns = 79;

    google.protobuf.Timestamp last_visited_at = 80;

    // Set when the installation features this actor, absent otherwise.
    //
    // The accounts onboarding offers a new member to follow. A timestamp
    // rather than a flag because it is also the order: most recently featured
    // first. Absent rather than the epoch when unset, for the reason
    // deleted_at gives.
    google.protobuf.Timestamp featured_at = 81;
}

message Nodes {
    repeated Node nodes = 1;
}

message NodeBrowseRequest {
    repeated string types = 1;
    repeated int64 owner_ids = 2;
    repeated int64 parent_ids = 3;
    double nearby_latitude = 4;
    double nearby_longitude = 5;
    uint64 nearby_radius = 6;
    string ordering = 7;
    string ordering_dir = 8;
    uint64 limit = 9;
    uint64 offset = 10;
    string search = 11;
    Viewer viewer = 12;
    bool access_check = 13;
}

message NodeBrowseResponse {
    repeated Node nodes = 1;
}

message NodeReadRequest {
    int64 id = 1;
}

message NodeReadResponse {
    Node node = 1;
}

message NodeReadByAliasRequest {
    string alias = 1;
    string node_type = 2;
}

message NodeReadByAliasResponse {
    Node node = 1;
}

message NodeEditRequest {
    Node node = 1;
}

message NodeEditResponse {
    Node node = 1;
}

message NodeAddRequest {
    Node node = 1;
}

message NodeAddResponse {
    Node node = 1;
}

message NodeDeleteRequest {
    int64 id = 1;
}

message NodeDeleteResponse {
    bool success = 1;
}

message NodeCountRequest {
    repeated string types = 1;
    repeated int64 owner_ids = 2;
    repeated int64 parent_ids = 3;
    string search = 4;
    double nearby_latitude = 5;
    double nearby_longitude = 6;
    uint64 nearby_radius = 7;
    Viewer viewer = 8;
    bool access_check = 9;
}

message NodeCountResponse {
    uint64 total = 1;
}

message NodeFilterVisibleRequest {
    repeated int64 ids = 1;
    Viewer viewer = 2;
}

message NodeFilterVisibleResponse {
    // The ids the viewer may see, in no particular order.
    repeated int64 ids = 1;
}

message NodeBatchReadRequest {
    repeated int64 ids = 1;
    string ordering = 2;
    string ordering_dir = 3;
}

message NodeBatchReadResponse {
    repeated Node nodes = 1;
}

message NodeBatchReadByAliasesRequest {
    repeated string aliases = 1;
    string node_type = 2;
    string ordering = 3;
    string ordering_dir = 4;
}

message NodeBatchReadByAliasesResponse {
    repeated Node nodes = 1;
}

message NodeBatchEditRequest {
    repeated Node nodes = 1;
    Viewer viewer = 2;
}

message NodeBatchEditResponse {
    repeated Node nodes = 1;
}

message NodeBatchAddRequest {
    repeated Node nodes = 1;
    Viewer viewer = 2;
}

message NodeBatchAddResponse {
    repeated Node nodes = 1;
}

message NodeBatchDeleteRequest {
    repeated int64 ids = 1;
}

message NodeBatchDeleteResponse {
    bool success = 1;
}

message BrowseMutualConnectionsRequest {
    int64 node_a_id = 1;
    int64 node_b_id = 2;
    string edge_type = 3;
    string direction = 4; // "in", "out", "mutual"
    string ordering = 5;
    uint64 limit = 6;
    uint64 offset = 7;
    Viewer viewer = 8;
    bool access_check = 9;
}

message BrowseMutualConnectionsResponse {
    repeated Node nodes = 1;
}

message CountConnectionsRequest {
    int64 node_id = 1;
    string edge_type = 2;
    Viewer viewer = 3;
    bool access_check = 4;
}

message CountConnectionsResponse {
    uint64 total = 1;
}

message ReadConnectionStatsRequest {
    int64 node_id = 1;
    Viewer viewer = 2;
    bool access_check = 3;
}

message ReadConnectionStatsResponse {
    uint64 follower_count = 1;
    uint64 leader_count = 2;
    uint64 subscriber_count = 4;
    uint64 comment_count = 5;
    uint64 vote_up_count = 6;
    // 3 was mutual_count and 7 was vote_down_count; both columns are gone.
    reserved 3, 7;
    uint64 repost_count = 8;
    uint64 quote_count = 9;
}

service NodeService {
    rpc Browse(NodeBrowseRequest) returns (NodeBrowseResponse);
    rpc Read(NodeReadRequest) returns (NodeReadResponse);
    rpc ReadByAlias(NodeReadByAliasRequest) returns (NodeReadByAliasResponse);
    rpc Edit(NodeEditRequest) returns (NodeEditResponse);
    rpc Add(NodeAddRequest) returns (NodeAddResponse);
    rpc Delete(NodeDeleteRequest) returns (NodeDeleteResponse);
    rpc Count(NodeCountRequest) returns (NodeCountResponse);

    // Batch operations
    // Which of these nodes may this viewer see? Any kind of node. See
    // nodesRepo.FilterVisible.
    rpc FilterVisible(NodeFilterVisibleRequest) returns (NodeFilterVisibleResponse);
    rpc BatchRead(NodeBatchReadRequest) returns (NodeBatchReadResponse);
    rpc BatchReadByAliases(NodeBatchReadByAliasesRequest) returns (NodeBatchReadByAliasesResponse);
    rpc BatchEdit(NodeBatchEditRequest) returns (NodeBatchEditResponse);
    rpc BatchAdd(NodeBatchAddRequest) returns (NodeBatchAddResponse);
    rpc BatchDelete(NodeBatchDeleteRequest) returns (NodeBatchDeleteResponse);

    // Relationship Queries
    rpc BrowseMutualConnections(BrowseMutualConnectionsRequest) returns (BrowseMutualConnectionsResponse);
    rpc CountConnections(CountConnectionsRequest) returns (CountConnectionsResponse);
    rpc ReadConnectionStats(ReadConnectionStatsRequest) returns (ReadConnectionStatsResponse);
}
