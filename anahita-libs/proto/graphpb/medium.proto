syntax = "proto3";

package graph;

option go_package = "/graphpb";

import "proto/graphpb/context.proto";
import "proto/graphpb/node.proto";

message Media {
    repeated Node mediums = 1;
}

message MediumCountRequest {
    repeated string types = 1;
    int64 owner_id = 2;
    string search = 3;
    Viewer viewer = 4;
    bool access_check = 5;
    // As on a browse.
    bool include_replies = 6;
}

message MediumCountResponse {
    uint64 total = 1;
}

message MediumBrowseRequest {
    repeated string types = 1;
    int64 owner_id = 2;
    string ordering = 3;
    string direction = 4;
    uint64 limit = 5;
    uint64 offset = 6;
    string search = 7;
    bool access_check = 8;

    Viewer viewer = 9;

    // Replies are left out of a list of posts unless this is set: a list of
    // somebody's notes is not to be filled with their answers to others.
    bool include_replies = 10;
}

message MediumBrowseResponse {
    repeated Node media = 1;
}

message MediumReadRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message MediumReadResponse {
    Node medium = 1;
}

message MediumBatchReadRequest {
    repeated int64 ids = 1;
    string ordering = 2;
    string direction = 3;
    Viewer viewer = 4;
}

message MediumBatchReadResponse {
    repeated Node media = 1;
}

message MediumEditRequest {
    Node medium = 1;
    Viewer viewer = 2;
}

message MediumEditResponse {
    Node medium = 1;
}

message MediumAddRequest {
    Node medium = 1;
    Viewer viewer = 2;
}

message MediumAddResponse {
    Node medium = 1;
}

message MediumDeleteRequest {
    int64 id = 1;
    Viewer viewer = 2;
}

message MediumDeleteResponse {
    int64 id = 1;
}

message MediumPingRequest {
    string message = 1;
}

message MediumPingResponse {
    string message = 1;
}

// Every reply under a post, oldest first, that the viewer may see.
message MediumThreadRequest {
    int64 root_id = 1;
    Viewer viewer = 2;
}

message MediumThreadResponse {
    repeated Node replies = 1;
    // The replies among them that have been hidden from the thread. They are
    // sent, marked here, so the caller can leave them out for most people
    // and show them to whoever may bring them back.
    repeated int64 hidden_ids = 2;
}

// Hides a reply from its thread, or shows it again.
message ReplyHideRequest {
    int64 reply_id = 1;
    bool hidden = 2;
    int64 viewer_id = 3;
}

message ReplyHideResponse {
    bool success = 1;
}

// Takes the quoted post out of a note that quotes it.
message QuoteDetachRequest {
    int64 note_id = 1;
    int64 viewer_id = 2;
}

message QuoteDetachResponse {
    // False when it was detached already.
    bool success = 1;
}

// One image of a photo post.
message PhotoFile {
    int64 node_id = 1;
    int32 position = 2;
    string filename = 3;
    string mimetype = 4;
    int32 width = 5;
    int32 height = 6;
    string alt_text = 7;
}

// An image uploaded and not in a post yet.
message PhotoUpload {
    int64 id = 1;
    int64 owner_id = 2;
    int64 created_by = 3;
    string filename = 4;
    string mimetype = 5;
    int32 width = 6;
    int32 height = 7;
}

message PhotoUploadAddRequest {
    PhotoUpload upload = 1;
}

message PhotoUploadAddResponse {
    int64 id = 1;
}

message PhotoUploadsReadRequest {
    repeated int64 ids = 1;
}

message PhotoUploadsReadResponse {
    repeated PhotoUpload uploads = 1;
}

message PhotoFilesBrowseRequest {
    repeated int64 node_ids = 1;
}

message PhotoFilesBrowseResponse {
    repeated PhotoFile files = 1;
}

// The images a post is to have from now on, in order, and the uploads that
// were used to make them, which stop being uploads in the same step.
message PhotoFilesSetRequest {
    int64 node_id = 1;
    repeated PhotoFile files = 2;
    repeated int64 upload_ids = 3;
}

message PhotoFilesSetResponse {
    repeated PhotoFile files = 1;
}

service MediumService {
    rpc Count(MediumCountRequest) returns (MediumCountResponse) {}
    rpc Browse(MediumBrowseRequest) returns (MediumBrowseResponse) {}
    rpc Read(MediumReadRequest) returns (MediumReadResponse) {}
    rpc BatchRead(MediumBatchReadRequest) returns (MediumBatchReadResponse) {}
    rpc Edit(MediumEditRequest) returns (MediumEditResponse) {}
    rpc Add(MediumAddRequest) returns (MediumAddResponse) {}
    rpc Delete(MediumDeleteRequest) returns (MediumDeleteResponse) {}
    rpc Ping(MediumPingRequest) returns (MediumPingResponse) {}

    // Threads. A reply is a note with a parent, added and edited through
    // the calls above like any post.
    rpc Thread(MediumThreadRequest) returns (MediumThreadResponse) {}
    rpc HideReply(ReplyHideRequest) returns (ReplyHideResponse) {}
    rpc DetachQuote(QuoteDetachRequest) returns (QuoteDetachResponse) {}

    // The images of photo posts. A photo is a medium, and these are its
    // images, so they are kept by the service that keeps the post.
    rpc AddPhotoUpload(PhotoUploadAddRequest) returns (PhotoUploadAddResponse) {}
    rpc ReadPhotoUploads(PhotoUploadsReadRequest) returns (PhotoUploadsReadResponse) {}
    rpc BrowsePhotoFiles(PhotoFilesBrowseRequest) returns (PhotoFilesBrowseResponse) {}
    rpc SetPhotoFiles(PhotoFilesSetRequest) returns (PhotoFilesSetResponse) {}
}
