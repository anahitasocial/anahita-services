services:

# nginx - reverse proxy
  nginx:
    # container_name: nginx
    # image: nginx:alpine
    build:
      context: .
      dockerfile: ./dockerfiles/nginx.dockerfile
    restart: always
    hostname: nginx
    ports:
      - "80:80"
    environment:
      # The web app's origin, the one origin allowed to call the API with
      # the session cookie.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        - ./nginx/templates:/etc/nginx/templates:ro
        - ./nginx/index.html:/etc/nginx/html/index.html
    networks:
      anahita-network:
        ipv4_address: 172.20.1.2

# MySQL - database
  mysql:
    platform: linux/arm64 # Use this line if you are on an ARM64 architecture (e.g., Apple Silicon)
    image: mysql:9.6
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: anahita
      MYSQL_ROOT_PASSWORD: root
      # MYSQL_USER: root
      # MYSQL_PASSWORD: root
    volumes:
      - ./db-data/mysql:/var/lib/mysql
    networks:
      anahita-network:
        ipv4_address: 172.20.1.3
    command:
      --group_concat_max_len=64000

# Redis - session store
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - ./db-data/redis:/data
    networks:
      anahita-network:
        ipv4_address: 172.20.1.4


# auth-service - handles user auth
  auth-service:
    build:
      context: .
      dockerfile: ./dockerfiles/auth-service.dockerfile
    restart: always
    ports:
      - "8081:80"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      IP_LOCATION_URL: ${IP_LOCATION_URL:-}
      DSN: ${DSN}
      MAX_DB_CONNECTIONS: ${MAX_DB_CONNECTIONS}
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      # Secrets-at-rest encryption. "local" (the default) needs only
      # CRYPT_LOCAL_KEY; "kms" needs AWS_KMS_KEY_ID and credentials.
      CRYPT_BACKEND: ${CRYPT_BACKEND}
      CRYPT_LOCAL_KEY: ${CRYPT_LOCAL_KEY}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID}
      SECURE_COOKIE_KEY: ${SECURE_COOKIE_KEY}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_TLS: ${REDIS_TLS:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      SITE_NAME: ${SITE_NAME:-}
      # How this installation introduces itself to OTHER SERVERS, published
      # as nodeName and nodeDescription in NodeInfo. Distinct from SITE_NAME,
      # which is branding read by people who already know where they are.
      # Both optional: the name falls back through SITE_NAME to DOMAIN_NAME,
      # and an unwritten description is published empty rather than invented.
      ANAHITA_INSTANCE_NAME: ${ANAHITA_INSTANCE_NAME:-}
      ANAHITA_INSTANCE_DESCRIPTION: ${ANAHITA_INSTANCE_DESCRIPTION:-}
      SYSTEM_EMAIL: ${SYSTEM_EMAIL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      # The rest of the contact details on the public /support page. Both
      # optional — plenty of installations have no phone line. Published through
      # NodeInfo, so changing one is a restart and not a frontend rebuild.
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_WEBSITE: ${SUPPORT_WEBSITE:-}
      # Label authenticator apps show for 2FA entries. Optional —
      # unset, it is derived from DOMAIN_NAME (with a "Staging" suffix
      # on staging, so the two environments are distinguishable in an
      # authenticator that holds both).
      TOTP_ISSUER: ${TOTP_ISSUER:-}
      MAIL_SERVICE_ADDR: "mail-grpc-service:50051"
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      # Only for resolving who administers a group, so a group deletion can
      # be reported to the people responsible for it. Optional.
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      AMQP_ADDR: ${AMQP_ADDR}
      # OAUTH
      OAUTH_ISSUER: ${OAUTH_ISSUER}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://auth-service:80/.well-known/jwks.json}
      OAUTH_PRIVATE_KEY_PATH: ${OAUTH_PRIVATE_KEY_PATH}
      OAUTH_SIGNER_BACKEND: ${OAUTH_SIGNER_BACKEND}
      OAUTH_KMS_KEY_ALIAS: ${OAUTH_KMS_KEY_ALIAS}
      OAUTH_SEED_CLIENT_PATH: ${OAUTH_SEED_CLIENT_PATH}
      # How this installation lets people in: open, approval, invite or
      # closed. Governs SELF-SERVE registration; invitations are their own
      # door, except under `closed`, which suspends outstanding ones too.
      #
      # UNSET MEANS CLOSED. An installation nobody has configured should not
      # be open to the internet — a closed one is noticed in a minute by the
      # operator, an open one when the spam arrives.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-}
      # Who may issue an invitation: administrators (the default) or members.
      #
      # Under `members` an invitation becomes a recommendation rather than a
      # decision — the member is not the person who would otherwise be
      # deciding. Browsing and revoking stay with administrators either way.
      INVITES_FROM: ${INVITES_FROM:-}
      # Who may CREATE A GROUP: registered, administrators or
      # super-administrators. Defaults to administrators, which is what
      # happened before this setting existed.
      #
      # actor-service is what enforces it. auth-service is given the same
      # value only so /nodeinfo/2.1 can publish it, which is how the web app
      # knows whether to offer a + on the groups page. Both read this one
      # entry, so they cannot be given different answers.
      GROUPS_FROM: ${GROUPS_FROM:-}
      # Who may make an event of their own: registered (the default),
      # administrators or super-administrators. Enforced by actor-service
      # and published by auth-service, from this one entry.
      EVENTS_FROM: ${EVENTS_FROM:-}
      # Video: whether it may be posted, and the limits, for the web app.
      # See docs/videos.md.
      VIDEO_UPLOADS: ${VIDEO_UPLOADS:-}
      VIDEO_MAX_BYTES: ${VIDEO_MAX_BYTES:-}
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-}
      # How many invitations one person may have OUTSTANDING at once. A slot
      # frees when one is accepted, expires, or is revoked. Defaults to 5 for
      # members and 100 for administrators.
      INVITE_PENDING_MAX: ${INVITE_PENDING_MAX:-}
      INVITE_PENDING_MAX_ADMIN: ${INVITE_PENDING_MAX_ADMIN:-}
      # Where the Terms and the Privacy Policy can be read. Their VERSIONS are
      # not set here — the web app holds them beside the text, in
      # statics/legal/index.js, and raising one is what re-prompts people. Either a path on the web app —
      # "/legal/terms" — or a whole URL when the canonical text is hosted
      # somewhere else. Defaults to /legal/tos and /legal/privacy.
      TOS_URL: ${TOS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      # The first super administrator, seeded at boot.
      #
      # Does nothing unless the installation has NO active super administrator,
      # so it is inert on every existing deployment and can be left set. On a
      # fresh install it creates the account with an unusable password and
      # prints a set-password link to this container's log — read it with
      # `docker compose logs auth-service`. The link is also emailed, but the
      # log is the path that works when SMTP is not configured yet.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
      - ./oauth-signing.pem:/run/secrets/oauth-signing.pem:ro
      - ./auth-defaults/oauth_seed_clients.json:/app/defaults/oauth_seed_clients.json:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.10

# actor-service - the profiles of people and of groups
#
# One service for every kind of actor. Each kind keeps its own address,
# /people/ and /groups/, and the gateway sends both here. It reads and writes
# through graph-grpc-service and is given no database address.
  actor-service:
    build:
      context: .
      dockerfile: ./dockerfiles/actor-service.dockerfile
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - graph-grpc-service
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      AMQP_ADDR: ${AMQP_ADDR}
      SECURE_COOKIE_KEY: ${SECURE_COOKIE_KEY}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_TLS: ${REDIS_TLS:-}
      REDIS_PASSWORD: ""
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      OAUTH_ISSUER: ${OAUTH_ISSUER}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://auth-service:80/.well-known/jwks.json}
      # Who may create a group. Enforced here; auth-service is given the same
      # value so it can publish it in NodeInfo. See the note there.
      GROUPS_FROM: ${GROUPS_FROM:-}
      # Who may make an event of their own: registered (the default),
      # administrators or super-administrators. Enforced by actor-service
      # and published by auth-service, from this one entry.
      EVENTS_FROM: ${EVENTS_FROM:-}
      # The web app's address, for the link back in an event's calendar file.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # The geocoders, as location-service has them: an event's address is
      # found on a map here, when whoever makes the event asks for one.
      GEOCODER_PHOTON_URL: ${GEOCODER_PHOTON_URL:-}
      GEOCODER_NOMINATIM_URL: ${GEOCODER_NOMINATIM_URL:-}
      GEOCODER_CONTACT: ${GEOCODER_CONTACT:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.11

