# file-grpc-service - handles file
  file-grpc-service:
    build:
      context: .
      dockerfile: ./dockerfiles/file-grpc-service.dockerfile
    restart: always
    ports:
      - "50055:50051"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      # Any S3-compatible store. See docs/configuration.md, Storage.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-}
      STORAGE_SSE: ${STORAGE_SSE:-}
      STORAGE_SEND_ACL: ${STORAGE_SEND_ACL:-}
      STORAGE_ALLOWED_TYPES: ${STORAGE_ALLOWED_TYPES:-}
      # The names used before STORAGE_* existed, still read as fallbacks so
      # an installation on AWS S3 needs no change.
      AWS_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_FILES_S3_BUCKET: ${AWS_FILES_S3_BUCKET:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.28

# garage - S3-compatible object storage for local development.
# Development only: its configuration holds published secrets. An installation
# on AWS S3 or another provider ignores it; it is small enough to leave running.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: always
    ports:
      # The S3 API. Browsers load uploaded images from here, through presigned
      # URLs, so it has to be reachable from the host.
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./db-data/garage/meta:/var/lib/garage/meta
      - ./db-data/garage/data:/var/lib/garage/data
    networks:
      anahita-network:
        ipv4_address: 172.20.1.35

# identity-image-service - the avatars and covers of profiles and posts
#
# The pictures a profile or a post is recognised by. Each kind keeps its own
# address, /avatars/ and /covers/, and the gateway sends both here. It is
# apart from the services that serve profiles and posts because opening
# pictures people upload is the heaviest and riskiest thing done with them.
  identity-image-service:
    build:
      context: .
      dockerfile: ./dockerfiles/identity-image-service.dockerfile
    restart: always
    ports:
      - "8096:80"
    depends_on:
      - file-grpc-service
      - graph-grpc-service
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      AMQP_ADDR: ${AMQP_ADDR}
      SECURE_COOKIE_KEY: ${SECURE_COOKIE_KEY}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_TLS: ${REDIS_TLS:-}
      REDIS_PASSWORD: ""
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      OAUTH_ISSUER: ${OAUTH_ISSUER}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://auth-service:80/.well-known/jwks.json}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.29

# abuse-report-service - reports of people and posts, and the cases
