    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.40

# video-worker - makes the sizes of each uploaded video with ffmpeg, and
# then the post. Answers no requests. Needs the same limits as video-service.
  video-worker:
    build:
      context: .
      dockerfile: ./dockerfiles/video-worker.dockerfile
    restart: always
    depends_on:
      - file-grpc-service
      - graph-grpc-service
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      GRPC_TLS: ${GRPC_TLS:-on}
      DSN: ${DSN}
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      VIDEO_MAX_BYTES: ${VIDEO_MAX_BYTES:-}
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-}
      # The sizes each video is made in, by height.
      VIDEO_RENDITIONS: ${VIDEO_RENDITIONS:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.41

# web-shell - sends the web app, with each page's own title, description
# and picture written into index.html, so a link to a profile or a post
# shows as itself where it is shared. Not started by `up`: it needs the web
# app's build. Run it with `make web_shell`. See docs/web-shell.md.
  web-shell:
    profiles: ["web"]
    build:
      context: .
      dockerfile: ./dockerfiles/web-shell.dockerfile
    restart: always
    ports:
      - "8102:80"
    depends_on:
      - file-grpc-service
      - graph-grpc-service
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # A site for members describes none of its pages to anybody else.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      # The address people reach the web app at. Left out, the address each
      # request came to is used.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
      # The web app's build: anahita-web's build/ folder.
      - ${WEB_BUILD_PATH:-./web-shell/web}:/app/web:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.39

# RabbitMQ - message broker
  rabbitmq:
    image: 'rabbitmq:3.12-alpine'
    restart: always
    ports:
        - "5672:5672"
    deploy:
        mode: replicated
        replicas: 1
    volumes:
        - ./db-data/rabbitmq/:/var/lib/rabbitmq/
    networks:
      anahita-network:
        ipv4_address: 172.20.1.31

# mail-service - handles email notifications
  mail-grpc-service:
    build:
      context: .
      dockerfile: ./dockerfiles/mail-grpc-service.dockerfile
    restart: always
    ports:
      - "50056:50051"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      # Branding, applied by this service to every message so that any sender
      # gets the same header without having to pass it.
      SITE_NAME: ${SITE_NAME:-}
      SITE_LOGO_URL: ${SITE_LOGO_URL:-}
      # SMTP is the only transport. Any provider works — point these at
      # Mailgun's relay, SES, Postmark, an internal MTA, or a local sink.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      # Optional: leave both empty for a relay that accepts unauthenticated
      # mail from inside the network, such as a local mail sink.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # true for implicit TLS (port 465); false upgrades in place with
      # STARTTLS (port 587), which is what most providers expect.
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Where every message goes when ENV=dev. Required in development — the
      # service refuses to start without it rather than mailing real people
      # from a development machine.
      DEVELOPER_EMAIL: ${DEVELOPER_EMAIL:-}
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.32

# migration-job - handles database migrations
  migration-job:
    build:
      context: .
      dockerfile: ./dockerfiles/migration-job.dockerfile
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: anahita
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      - mysql
    networks:
      anahita-network:
        ipv4_address: 172.20.1.33

# feed-service - handles feeds
  feed-service:
    build:
      context: .
      dockerfile: ./dockerfiles/feed-service.dockerfile
    restart: always
    ports:
      - "8098:80"
      - "50059:50051"
    depends_on:
      - file-grpc-service
      - graph-grpc-service
    deploy:
      mode: replicated
      replicas: 1
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      DSN: ${DSN}
      AMQP_ADDR: ${AMQP_ADDR}
      SECURE_COOKIE_KEY: ${SECURE_COOKIE_KEY}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_TLS: ${REDIS_TLS:-}
      REDIS_PASSWORD: ""
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      GRAPH_SERVICE_ADDR: "graph-grpc-service:50051"
      OAUTH_ISSUER: ${OAUTH_ISSUER}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://auth-service:80/.well-known/jwks.json}
      DEFAULTS_PATH: /feed-defaults
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
      - ./feed-defaults:/feed-defaults:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.34

# graph-grpc-service - handles graph
# account-sweeper - purges profiles past their 30-day deletion grace period
#
# On the "jobs" profile, so it does NOT start with `docker compose up`. Run it
# on demand with:
#   docker compose run --rm account-sweeper
#
# In Kubernetes this is a CronJob (k8s/03-sweeper-cronjob.yml). There is no
# scheduler in compose, which is fine for development — the point here is being
# able to trigger a sweep and watch what it does.
  account-sweeper:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: ./dockerfiles/sweeper-job.dockerfile
    restart: "no"
    environment:
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      DSN: ${DSN}
      AMQP_ADDR: ${AMQP_ADDR}
      # So uploaded avatars, covers and photos are deleted from storage as
      # accounts are purged. Without it the rows go and the objects stay.
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
    depends_on:
      - mysql
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
    networks:
      anahita-network:

  graph-grpc-service:
    build:
      context: .
      dockerfile: ./dockerfiles/graph-grpc-service.dockerfile
    restart: always
    ports:
      - "50054:50051"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      # Whether profiles have video at all. See docs/videos.md.
      VIDEO_UPLOADS: ${VIDEO_UPLOADS:-}
      ENV: ${ENV}
      # Mutual TLS between the services. See docs/configuration.md, Internal calls.
      GRPC_TLS: ${GRPC_TLS:-on}
      # What the installation lets people who are not signed in see, and
      # whether anything new may be public. The same for every service; see
      # docs/configuration.md, Privacy of the installation.
      SITE_READ_ACCESS: ${SITE_READ_ACCESS:-}
      MIN_CONTENT_ACCESS: ${MIN_CONTENT_ACCESS:-}
      DSN: ${DSN}
      AMQP_ADDR: ${AMQP_ADDR}
      # So a purge a super administrator asks for also removes the uploaded
      # avatars, covers and photos. Without it the rows go and the objects stay.
      FILE_SERVICE_ADDR: "file-grpc-service:50051"
      ACTOR_FEATURES_PATH: /defaults/actor_features
    volumes:
      - ./grpc-certs:/run/secrets/grpc:ro
      - ./graph-grpc-defaults/actor_features:/defaults/actor_features:ro
    networks:
      anahita-network:
        ipv4_address: 172.20.1.27

networks:
    anahita-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.1.0/24
