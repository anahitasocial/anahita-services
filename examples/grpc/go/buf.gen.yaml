# Generates the client into gen/: buf generate ../../../anahita-libs --path ../../../anahita-libs/proto/graphpb
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: example.com/anahita-grpc/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen
    opt: paths=source_relative
